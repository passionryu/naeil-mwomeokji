<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내일 뭐 먹지? 🍽️</title>
<meta name="description" content="질문 7개에 답하면 벨포레스퀘어 9곳 중 너한테 딱 맞는 식당을 골라줄게">
<meta property="og:type" content="website">
<meta property="og:title" content="내일 뭐 먹지? 🍽️">
<meta property="og:description" content="질문 7개, 30초! 너한테 딱 맞는 식당을 골라줄게">
<meta property="og:image" content="https://passionryu.github.io/naeil-mwomeokji/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://passionryu.github.io/naeil-mwomeokji/">
<meta name="theme-color" content="#FFF7EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17120F" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
<style>
  :root {
    --bg: #FFF7EE; --card: #FFFFFF; --ink: #2B1D14; --muted: #8A7565; --line: #F0E0D0;
    --accent: #FF5A1F; --accent-ink: #FFFFFF; --soft: #FFE6D8; --good: #1F9D55; --warn-bg: #FFF1C9; --warn-ink: #7A5A00;
    --shadow: 0 1px 2px rgba(60,30,10,.06), 0 6px 20px rgba(60,30,10,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17120F; --card: #221B17; --ink: #F6EDE5; --muted: #B39F90; --line: #3A2E26;
      --accent: #FF7A45; --accent-ink: #1B0F08; --soft: #3A2218; --good: #4ADE80; --warn-bg: #3A3014; --warn-ink: #F5D77A;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere;
  }
  button, input { font: inherit; color: inherit; }
  .app {
    max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
    padding: max(16px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column;
  }
  .screen { display: flex; flex-direction: column; flex: 1; animation: in .28s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* 인트로 */
  .badge { align-self: flex-start; background: var(--soft); color: var(--accent); font-weight: 700; font-size: 13px; padding: 6px 12px; border-radius: 999px; }
  .intro-hero { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px 0; }
  .intro-hero h1 { font-size: 44px; line-height: 1.12; margin: 16px 0 12px; letter-spacing: -1.5px; }
  .intro-hero h1 em { font-style: normal; color: var(--accent); }
  .intro-hero p { color: var(--muted); font-size: 17px; line-height: 1.55; margin: 0; }
  .emoji-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 28px 0 0; font-size: 30px; }
  .emoji-row span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  .field label { display: block; font-weight: 700; font-size: 15px; margin-bottom: 8px; }
  .field input {
    width: 100%; height: 56px; border-radius: 16px; border: 2px solid var(--line); background: var(--card);
    padding: 0 16px; font-size: 18px; outline: none; transition: border-color .15s;
  }
  .field input:focus { border-color: var(--accent); }
  .fine { color: var(--muted); font-size: 13px; text-align: center; margin: 12px 0 0; }

  /* 버튼 */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px;
    border: 0; border-radius: 16px; font-size: 17px; font-weight: 700; cursor: pointer; text-decoration: none;
    transition: transform .08s, opacity .15s;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:disabled { opacity: .35; }
  .btn-ghost { background: var(--card); color: var(--ink); border: 2px solid var(--line); }
  .btn + .btn { margin-top: 10px; }
  .btn-text { background: none; border: 0; color: var(--muted); font-size: 15px; padding: 12px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  /* 질문 */
  .topbar { display: flex; align-items: center; gap: 12px; height: 44px; }
  .back { width: 44px; height: 44px; margin-left: -10px; border: 0; background: none; font-size: 24px; cursor: pointer; border-radius: 12px; }
  .back:disabled { visibility: hidden; }
  .progress { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
  .count { font-size: 14px; font-weight: 700; color: var(--muted); min-width: 32px; text-align: right; }
  .q-title { font-size: 28px; line-height: 1.3; letter-spacing: -.8px; margin: 24px 0 6px; white-space: pre-line; }
  .q-hint { color: var(--muted); font-size: 14px; margin: 0 0 20px; min-height: 1em; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-bottom: 16px; }
  .options.list { grid-template-columns: 1fr; }
  .opt {
    position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    min-height: 84px; padding: 14px; border-radius: 18px; border: 2px solid var(--line); background: var(--card);
    text-align: left; cursor: pointer; box-shadow: var(--shadow); transition: border-color .12s, background .12s, transform .08s;
  }
  .options.list .opt { flex-direction: row; align-items: center; min-height: 64px; gap: 12px; }
  .opt:active { transform: scale(.97); }
  .opt .e { font-size: 28px; line-height: 1; }
  .opt .l { font-size: 16px; font-weight: 600; line-height: 1.3; }
  .opt.wide { grid-column: 1 / -1; flex-direction: row; align-items: center; min-height: 56px; }
  .opt .check {
    position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; color: var(--accent-ink);
  }
  .options.list .opt .check, .opt.wide .check { position: static; margin-left: auto; }
  .opt.on { border-color: var(--accent); background: var(--soft); }
  .opt.on .check { background: var(--accent); border-color: var(--accent); }
  .opt.on .check::after { content: "✓"; font-weight: 800; }
  .dock { position: sticky; bottom: 0; margin-top: auto; padding: 12px 0 0; background: linear-gradient(to bottom, transparent, var(--bg) 30%); }

  /* 로딩 */
  .loading { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .slot { font-size: 84px; height: 100px; line-height: 100px; }
  .loading p { color: var(--muted); font-size: 17px; font-weight: 600; margin: 0; }

  /* 결과 */
  .r-head { text-align: center; padding: 18px 0 8px; }
  .r-head .who { color: var(--muted); font-size: 16px; font-weight: 600; }
  .r-emoji { font-size: 88px; line-height: 1.1; margin: 10px 0 4px; animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
  .r-name { font-size: 34px; font-weight: 800; letter-spacing: -1px; margin: 0; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 12px 0 0; }
  .chip { font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); color: var(--muted); }
  .chip.hot { background: var(--soft); color: var(--accent); border-color: transparent; }
  .chip.warn { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-top: 16px; box-shadow: var(--shadow); }
  .card h3 { font-size: 14px; color: var(--muted); margin: 0 0 10px; font-weight: 700; }
  .why { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .why li { display: flex; gap: 8px; font-size: 16px; font-weight: 600; }
  .why li::before { content: "✓"; color: var(--good); font-weight: 800; }
  .runner { display: flex; align-items: center; gap: 12px; padding: 10px 0; text-decoration: none; color: inherit; }
  .runner + .runner { border-top: 1px solid var(--line); }
  .runner .rank { width: 28px; font-weight: 800; color: var(--muted); }
  .runner .e { font-size: 28px; }
  .runner .n { font-weight: 700; font-size: 16px; }
  .runner .k { color: var(--muted); font-size: 13px; }
  .runner .go { margin-left: auto; color: var(--muted); }
  .share-box {
    margin-top: 16px; padding: 14px; border-radius: 16px; border: 2px dashed var(--line); background: transparent;
    font-size: 15px; line-height: 1.5; width: 100%; resize: none; color: var(--ink); -webkit-user-select: all; user-select: all;
  }
  .share-label { font-size: 14px; font-weight: 700; margin: 24px 0 0; }
  .banned { color: var(--muted); font-size: 13px; text-align: center; margin: 12px 0 0; }
  .actions { margin-top: 12px; }

  .toast {
    position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 700; font-size: 15px;
    opacity: 0; pointer-events: none; transition: .25s; max-width: calc(100% - 40px); text-align: center; z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="core.js"></script>
<script>
(function () {
  const { RESTAURANTS, QUESTIONS, PRICE_LABEL, visibleOptions, recommend, shareText } = window.Core;
  const app = document.getElementById("app");
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  let state = { step: -1, name: store.get("mwo_name") || "", answers: {} };

  // 뒤로가기(안드로이드 버튼/스와이프) 대응
  function go(step, push = true) {
    state.step = step;
    if (push) try { history.pushState({ step }, ""); } catch (e) {}
    render();
    window.scrollTo(0, 0);
  }
  try { history.replaceState({ step: -1 }, ""); } catch (e) {}
  window.addEventListener("popstate", (e) => {
    const s = e.state && typeof e.state.step !== "undefined" ? e.state.step : -1;
    go(s === "result" || s === "loading" ? QUESTIONS.length - 1 : s, false);
  });

  function render() {
    if (state.step === -1) return renderIntro();
    if (state.step === "loading") return renderLoading();
    if (state.step === "result") return renderResult();
    renderQuestion(state.step);
  }

  function renderIntro() {
    app.innerHTML = `
      <section class="screen">
        <span class="badge">9/20 (일) · 저녁 5:30~6시</span>
        <div class="intro-hero">
          <h1>내일<br><em>뭐 먹지?</em></h1>
          <p>질문 7개에 답하면<br>벨포레스퀘어 9곳 중 너한테 딱 맞는 곳을 골라줄게.</p>
          <div class="emoji-row">${RESTAURANTS.map((r, i) => `<span style="animation-delay:${i * 0.15}s">${r.emoji}</span>`).join("")}</div>
        </div>
        <div class="field">
          <label for="name">이름 (단톡방에서 부르는 이름)</label>
          <input id="name" maxlength="10" autocomplete="off" placeholder="예: 민수" value="${esc(state.name)}">
        </div>
        <div class="dock">
          <button class="btn btn-primary" id="start" ${state.name.trim() ? "" : "disabled"}>시작하기 →</button>
          <p class="fine">30초면 끝 · 결과를 복사해서 단톡방에 올려줘</p>
        </div>
      </section>`;
    const input = document.getElementById("name");
    const start = document.getElementById("start");
    input.addEventListener("input", () => { state.name = input.value; start.disabled = !input.value.trim(); });
    const begin = () => {
      if (!state.name.trim()) return input.focus();
      state.name = state.name.trim();
      store.set("mwo_name", state.name);
      state.answers = {};
      go(0);
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") begin(); });
    start.addEventListener("click", begin);
  }

  function renderQuestion(i) {
    const q = QUESTIONS[i];
    const opts = visibleOptions(q, state.answers);
    // 숨겨진 옵션이 선택되어 있었다면 해제
    const sel = (state.answers[q.id] || []).filter((id) => opts.some((o) => o.id === id));
    state.answers[q.id] = sel;
    const list = !q.multi && opts.length <= 4 ? "list" : "";

    app.innerHTML = `
      <section class="screen">
        <div class="topbar">
          <button class="back" id="back" aria-label="이전">←</button>
          <div class="progress"><i style="width:${((i + 1) / QUESTIONS.length) * 100}%"></i></div>
          <span class="count">${i + 1}/${QUESTIONS.length}</span>
        </div>
        <h2 class="q-title">${esc(q.title)}</h2>
        <p class="q-hint">${esc(q.hint || "")}</p>
        <div class="options ${list}" role="group">
          ${opts.map((o) => `
            <button class="opt ${o.exclusive ? "wide" : ""} ${sel.includes(o.id) ? "on" : ""}" data-id="${o.id}" aria-pressed="${sel.includes(o.id)}">
              <span class="e">${o.emoji}</span><span class="l">${esc(o.label)}</span><span class="check"></span>
            </button>`).join("")}
        </div>
        ${q.multi ? `<div class="dock"><button class="btn btn-primary" id="next" ${sel.length ? "" : "disabled"}>다음</button></div>` : ""}
      </section>`;

    document.getElementById("back").addEventListener("click", () => history.back());
    app.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => pick(q, b.dataset.id)));
    const next = document.getElementById("next");
    if (next) next.addEventListener("click", () => advance(i));
  }

  function pick(q, id) {
    const opt = q.options.find((o) => o.id === id);
    let sel = state.answers[q.id] || [];
    if (q.multi) {
      if (sel.includes(id)) sel = sel.filter((x) => x !== id);
      else if (opt.exclusive) sel = [id];
      else sel = sel.filter((x) => !q.options.find((o) => o.id === x).exclusive).concat(id);
      state.answers[q.id] = sel;
      app.querySelectorAll(".opt").forEach((b) => {
        const on = sel.includes(b.dataset.id);
        b.classList.toggle("on", on);
        b.setAttribute("aria-pressed", on);
      });
      document.getElementById("next").disabled = !sel.length;
    } else {
      state.answers[q.id] = [id];
      app.querySelectorAll(".opt").forEach((b) => b.classList.toggle("on", b.dataset.id === id));
      setTimeout(() => advance(state.step), 220);
    }
  }

  function advance(i) {
    if (state.step !== i) return;
    if (i < QUESTIONS.length - 1) go(i + 1);
    else {
      state.result = recommend(state.answers);
      go("loading", false);
    }
  }

  function renderLoading() {
    app.innerHTML = `<section class="screen loading"><div class="slot" id="slot">🍽️</div><p>9곳 비교하는 중…</p></section>`;
    const slot = document.getElementById("slot");
    let k = 0;
    const t = setInterval(() => { slot.textContent = RESTAURANTS[k++ % RESTAURANTS.length].emoji; }, 110);
    setTimeout(() => { clearInterval(t); go("result"); }, 1300);
  }

  function renderResult() {
    const { ranked, banned } = state.result;
    const top = ranked[0];
    const r = top.r;
    const why = [...new Set(top.why)].slice(0, 4);
    const text = shareText(state.name, state.answers, state.result);

    app.innerHTML = `
      <section class="screen">
        <div class="r-head">
          <div class="who">${esc(state.name)}에게 딱 맞는 곳은</div>
          <div class="r-emoji">${r.emoji}</div>
          <h2 class="r-name">${esc(r.name)}</h2>
          <div class="chips">
            <span class="chip">${esc(r.kind)}</span>
            <span class="chip ${r.price >= 2 ? "hot" : ""}">${r.price >= 2 ? "💸 " : ""}${PRICE_LABEL[r.price]}</span>
            <span class="chip">${esc(r.hours)}</span>
            ${r.warn ? `<span class="chip warn">⚠️ ${esc(r.warn)}</span>` : ""}
          </div>
        </div>

        ${why.length ? `<div class="card"><h3>이래서 골랐어</h3><ul class="why">${why.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}

        <p class="share-label">👇 이걸 복사해서 단톡방에 올려줘</p>
        <textarea class="share-box" id="shareText" readonly rows="3">${esc(text)}</textarea>
        <div class="actions">
          <button class="btn btn-primary" id="copy">📋 카톡에 결과 복사</button>
          ${navigator.share ? `<button class="btn btn-ghost" id="share">📤 바로 공유하기</button>` : ""}
          <a class="btn btn-ghost" href="${r.url}" target="_blank" rel="noopener">🗺️ 네이버 지도에서 보기</a>
        </div>

        ${ranked.length > 1 ? `
        <div class="card">
          <h3>아쉽게 놓친 곳</h3>
          ${ranked.slice(1, 3).map((x, i) => `
            <a class="runner" href="${x.r.url}" target="_blank" rel="noopener">
              <span class="rank">${i + 2}위</span><span class="e">${x.r.emoji}</span>
              <span><div class="n">${esc(x.r.name)}</div><div class="k">${esc(x.r.kind)} · ${PRICE_LABEL[x.r.price]}</div></span>
              <span class="go">›</span>
            </a>`).join("")}
        </div>` : ""}

        ${banned.length ? `<p class="banned">🚫 제외된 곳: ${banned.map((x) => esc(x.r.name)).join(", ")}</p>` : ""}
        <button class="btn-text" id="retry">처음부터 다시 하기</button>
      </section>`;

    document.getElementById("copy").addEventListener("click", () => copy(text));
    const share = document.getElementById("share");
    if (share) share.addEventListener("click", () => navigator.share({ text }).catch(() => {}));
    document.getElementById("retry").addEventListener("click", () => { state.answers = {}; go(-1); });
  }

  // 카톡 인앱 브라우저 대비: Clipboard API → execCommand → 직접 선택 안내
  async function copy(text) {
    try {
      await navigator.clipboard.writeText(text);
      return toast("복사 완료! 단톡방에 붙여넣어 줘 🙌");
    } catch (e) {}
    const box = document.getElementById("shareText");
    try {
      box.removeAttribute("readonly");
      box.focus();
      box.select();
      box.setSelectionRange(0, text.length);
      const ok = document.execCommand("copy");
      box.setAttribute("readonly", "");
      if (ok) return toast("복사 완료! 단톡방에 붙여넣어 줘 🙌");
    } catch (e) {}
    box.focus();
    box.select();
    toast("위 글자를 길게 눌러서 복사해줘 🙏");
  }

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  render();
})();
</script>
</body>
</html>
